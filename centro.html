<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="app-manifest" content="centro.webmanifest">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="iconos/icono-192.png" type="image/png">
<title>Centro de control</title>
<style>
  :root {
    --verde: #2f9e59; --verde-suave: #eaf6ec; --texto: #1c1c1e; --gris: #6b6b70; --borde: #e3e3e6;
    --fondo: #f7f7f8; --tarjeta: #ffffff; --rojo: #b42318; --rojo-suave: #fdeceb; --radio: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --verde: #4cc27a; --verde-suave: #16301f; --texto: #f2f2f4; --gris: #a1a1a8; --borde: #34343a;
      --fondo: #121214; --tarjeta: #1c1c1f; --rojo: #ff8a80; --rojo-suave: #3a1d1b; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: -apple-system, system-ui, "Segoe UI", sans-serif; margin: 0; color: var(--texto); background: var(--fondo); overflow-wrap: anywhere; }
  .env { max-width: 760px; margin: 0 auto; padding: 1rem 16px 3rem; }
  h1 { font-size: 1.3rem; margin: 0 0 0.2rem; }
  h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
  .subt { color: var(--gris); font-size: 0.9rem; margin: 0.2rem 0; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); padding: 1rem; margin: 0.8rem 0; }
  .prioritaria { border-color: var(--rojo); background: var(--rojo-suave); }
  input, select, textarea { font: inherit; font-size: 16px; width: 100%; padding: 0.55rem 0.7rem; border: 1px solid var(--borde); border-radius: 10px; background: var(--tarjeta); color: var(--texto); }
  textarea { min-height: 4.5rem; }
  button { font: inherit; border-radius: 999px; padding: 0.55rem 1.1rem; border: 1px solid var(--verde); background: var(--verde); color: #fff; cursor: pointer; }
  button.sec { background: transparent; color: var(--verde); }
  .pestanas { display: flex; gap: 0.5rem; margin: 0.8rem 0; flex-wrap: wrap; }
  .pestanas button[aria-selected="false"] { background: transparent; color: var(--verde); }
  .fila { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
  .fila > * { flex: 1 1 10rem; }
  ul { padding-left: 1.2rem; margin: 0.3rem 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  td, th { text-align: left; padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--borde); vertical-align: top; }
  .tabla { overflow-x: auto; }
  .persona { cursor: pointer; }
  .persona:hover { border-color: var(--verde); }
  .chip { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.8rem; background: var(--verde-suave); }
  .chip.rojo { background: var(--rojo-suave); color: var(--rojo); }
  code { font-size: 0.85rem; }
  /* #215: imprimir la ficha y el plan para la consulta: sin botones, sin alertas ni nota privada, en blanco y negro. */
  @media print {
    :root { --texto: #000; --gris: #444; --borde: #bbb; --fondo: #fff; --tarjeta: #fff; }
    .no-imprimir, button, #cc-aviso, .subt.cabecera { display: none !important; }
    body { background: #fff; font-size: 11pt; }
    .env { max-width: none; padding: 0; }
    .tarjeta { border: none; padding: 0; margin: 0 0 1rem; break-inside: avoid; }
    .tabla { overflow: visible; }
    a { color: inherit; text-decoration: none; }
    tr { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="env">
  <h1 class="no-imprimir">Centro de control</h1>
  <p class="subt cabecera">Para Pablo, como nutricionista. Lo que las personas guardan con «Que Pablo vea mis datos».</p>
  <div id="cc-aviso" class="tarjeta" role="status" aria-live="polite" hidden></div>
  <div id="cc-cuerpo"><p class="subt">Cargando…</p></div>
</div>
<script src="motor.bundle.js?v=a0c4577"></script>
<script src="centro.js?v=a0c4577"></script>
<script src="pwa.js?v=a0c4577"></script>
</body>
</html>
